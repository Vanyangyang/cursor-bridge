interface:
  display_name: "Grok Build Supervisor"
  short_description: "Persistently supervise Grok Build across Codex tasks"
  default_prompt: "Use $grok-build-supervisor to automatically connect or reuse the guarded Grok session needed by an authorized executor-mode task, send only authorized work, and keep the host turn active until completion or an exact user decision is required."

dependencies:
  tools:
    - type: "mcp"
      value: "grok-build-supervisor"
      description: "Ensure, reuse, and continuously supervise daemon-owned Grok Build Leader sessions"

policy:
  allow_implicit_invocation: true
