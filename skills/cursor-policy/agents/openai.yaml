interface:
  display_name: "Cursor Policy"
  short_description: "Set Cursor delegation policy for the current session"
  default_prompt: "Use $cursor-policy to inspect or set the current Cursor Bridge delegation mode to off, manual, auto, active, or eager, then report the effective session policy without treating it as a numeric call frequency."

dependencies:
  tools:
    - type: "mcp"
      value: "cursor-bridge"
      description: "Inspect or set the session-scoped Cursor delegation policy"

policy:
  allow_implicit_invocation: true
