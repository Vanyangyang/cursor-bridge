interface:
  display_name: "Cursor Delegation"
  short_description: "Delegate bounded Cursor work, then collect and verify safely"
  default_prompt: "Use $cursor-delegate under the effective session policy to hand Cursor a bounded task with clear purpose, scope, invariants, and acceptance checks, allow limited investigation and implementation inside that envelope, then collect and verify the real result in the primary agent."

dependencies:
  tools:
    - type: "mcp"
      value: "cursor-bridge"
      description: "Dispatch, track, and collect top-level Cursor Agent tasks over CDP"

policy:
  allow_implicit_invocation: true
