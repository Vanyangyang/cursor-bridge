name: Update star history

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'Vanyangyang/cursor-bridge'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Record the current star count
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-star-history.mjs --fetch

      - name: Commit a changed chart
        shell: bash
        run: |
          if git diff --quiet -- assets/star-history.json assets/star-history.svg; then
            echo "Star count is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/star-history.json assets/star-history.svg
          git commit -m "chore: update star history [skip ci]"
          git push
