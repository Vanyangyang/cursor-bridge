name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - run: npm --prefix plugins/grok-build-supervisor install
      - run: npm run build
      - name: Verify built dist bundles match committed artifacts
        run: git diff --exit-code -- dist plugins/grok-build-supervisor/dist
      - run: npm test
      - run: npm run smoke:mcp
      - run: npm run smoke:cli
      - run: npm run verify:install
      - run: npm --prefix plugins/grok-build-supervisor test
      - run: npm --prefix plugins/grok-build-supervisor run smoke:mcp

  macos-basic:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - name: Run macOS CLI and core unit tests plus stdio MCP smoke checks
        shell: bash
        run: |
          tests=(test/cdp-client.test.mjs test/workspace-identity.test.mjs test/model-config.test.mjs test/model-picker-open.test.mjs test/ai-install.test.mjs)
          tests+=(test/cce-preferences.test.mjs test/cce-source-routing.test.mjs test/cli-workspace.test.mjs test/cli-config-scope.test.mjs test/cursor-cli.test.mjs)
          tests+=(test/cursor-cli-acp.test.mjs test/cli-provider.test.mjs test/test-runner-env.test.mjs)
          if [[ -f test/cdp-identity.test.mjs ]]; then
            tests+=(test/cdp-identity.test.mjs)
          fi
          node scripts/test.mjs --test-reporter=spec --test-destination=stdout --test-reporter=github --test-destination=stdout "${tests[@]}"
      - run: npm run smoke:mcp
      - run: npm run smoke:cli
