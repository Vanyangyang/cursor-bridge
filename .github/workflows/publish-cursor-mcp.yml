name: Publish Cursor Bridge generic MCP

on:
  push:
    tags:
      - "cursor-bridge-mcp--v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Exact Cursor Bridge generic MCP release tag to publish again
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-cursor-bridge-generic-mcp
  cancel-in-progress: false

jobs:
  validate-dispatch-ref:
    name: Validate dispatched tag
    runs-on: ubuntu-latest
    steps:
      - name: Reject refs outside the Cursor Bridge generic MCP tag namespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ inputs.ref }}
        run: |
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            exit 0
          fi

          if [[ ! "$REF" =~ ^cursor-bridge-mcp--v[0-9][0-9A-Za-z._-]*$ ]] || ! git check-ref-format --allow-onelevel "refs/tags/$REF"; then
            echo "::error::ref must be an exact cursor-bridge-mcp--v* tag."
            exit 1
          fi

  publish:
    needs: validate-dispatch-ref
    permissions:
      contents: read
      id-token: write
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
    steps:
      - name: Match the supported Windows release checkout
        shell: pwsh
        run: git config --global core.autocrlf true

      - name: Check out trusted publishing tooling
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: .release-tooling
          ref: ${{ github.sha }}

      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: release
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.ref) || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm 12
        run: npm install --global npm@12

      - name: Publish Cursor Bridge generic MCP package
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/.release-tooling/scripts/publish-cursor-mcp.ps1" `
            -RepositoryRoot "$env:GITHUB_WORKSPACE/release" `
            -ExpectedTag $env:RELEASE_TAG
